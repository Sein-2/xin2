<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>这是一份道歉信</title>
<style>
  :root{
    --paper:#FBF8F2;
    --paper2:#F4EEE3;
    --card:#FFFDF9;
    --ink:#3B342C;
    --ink-soft:#857B6E;
    --gold:#C0A075;
    --gold-soft:#E3D5BE;
    --gold-line:rgba(192,160,117,.30);
    --accent:#B9764F;
    --shadow:0 14px 34px rgba(150,124,92,.10);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{scroll-behavior:smooth;}
  body{
    margin:0;color:var(--ink);
    font-family:"Songti SC","STSong","Source Han Serif SC","Noto Serif SC","PingFang SC",Georgia,serif;
    background:
      radial-gradient(900px 520px at 12% -8%, #FDF6EA 0%, rgba(253,246,234,0) 62%),
      radial-gradient(760px 520px at 92% 8%, #F6EEE1 0%, rgba(246,238,225,0) 58%),
      var(--paper);
    min-height:100vh;line-height:1.9;overflow-x:hidden;
  }
  /* 纸纹 */
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;z-index:1;opacity:.055;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/></filter><rect width='180' height='180' filter='url(%23n)'/></svg>");
  }

  .prog{position:fixed;top:0;left:0;height:2px;width:0;z-index:70;
    background:linear-gradient(90deg,#C0A075,#D9A05B);transition:width .12s linear;}

  /* ---------------- 封面 ---------------- */
  #cover{
    position:fixed;inset:0;z-index:50;
    background:linear-gradient(165deg,#FDFAF4 0%, #F3ECDF 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:24px;padding:32px;text-align:center;
    transition:opacity .8s ease, transform .8s ease, visibility .8s;
  }
  #cover.gone{opacity:0;visibility:hidden;transform:scale(1.05);pointer-events:none;}
  /* 漂浮的小光点 */
  .floats{position:absolute;inset:0;overflow:hidden;pointer-events:none;}
  .f{position:absolute;border-radius:50%;background:var(--gold-soft);opacity:.55;
    animation:drift linear infinite;}
  @keyframes drift{
    0%{transform:translate(0,0) rotate(0);}
    50%{transform:translate(7px,-20px) rotate(25deg);}
    100%{transform:translate(0,0) rotate(0);}
  }
  /* 纸飞机 */
  .plane-wrap{width:210px;height:125px;position:relative;}
  .plane-wrap svg{width:100%;height:100%;overflow:visible;}
  .plane{transform-box:view-box;transform-origin:64px 45px;animation:glide 6.5s ease-in-out infinite;}
  @keyframes glide{
    0%{transform:translate(0,0) rotate(0deg);}
    30%{transform:translate(9px,-7px) rotate(-4.5deg);}
    60%{transform:translate(-3px,5px) rotate(2deg);}
    100%{transform:translate(0,0) rotate(0deg);}
  }
  .trail{stroke-dasharray:5 7;animation:dash 1.5s linear infinite;}
  @keyframes dash{to{stroke-dashoffset:-24;}}
  #cover.fly .plane{animation:flyaway 1.05s cubic-bezier(.42,0,.72,.32) forwards;}
  @keyframes flyaway{
    0%{transform:translate(0,0) rotate(0deg) scale(1);opacity:1;}
    100%{transform:translate(170px,-140px) rotate(18deg) scale(.5);opacity:0;}
  }
  #cover.fly .trail,#cover.fly .f{opacity:0;transition:opacity .45s ease;}
  #cover h1{
    margin:10px 0 0;font-size:26px;font-weight:600;letter-spacing:.22em;color:var(--ink);
  }
  .open-btn{
    margin-top:10px;font-family:inherit;cursor:pointer;
    background:transparent;color:var(--accent);
    border:1px solid var(--gold);border-radius:999px;
    padding:12px 40px;font-size:15px;letter-spacing:.34em;text-indent:.34em;
    transition:all .3s ease;
  }
  .open-btn:hover{background:var(--gold);color:#fff;border-color:var(--gold);}

  /* ---------------- 正文 ---------------- */
  .wrap{max-width:640px;margin:0 auto;padding:78px 22px 96px;position:relative;z-index:2;}

  .head{text-align:center;margin-bottom:46px;position:relative;}
  .head .kicker{font-size:11.5px;letter-spacing:.42em;color:var(--gold);text-indent:.42em;}
  .head h2{
    margin:14px 0 0;font-size:29px;font-weight:600;letter-spacing:.14em;
  }
  .head .rule{
    width:64px;height:1px;margin:18px auto 0;background:var(--gold);
    transform:scaleX(0);animation:ruleIn 1.4s ease .3s forwards;
  }
  @keyframes ruleIn{to{transform:scaleX(1);}}
  .head .sub{margin-top:14px;font-size:13px;letter-spacing:.14em;color:var(--ink-soft);}

  .skip{
    position:fixed;right:16px;top:18px;z-index:40;
    background:rgba(255,253,249,.9);border:1px solid var(--gold-line);
    color:var(--ink-soft);font-family:inherit;font-size:12.5px;letter-spacing:.08em;
    padding:7px 15px;border-radius:999px;cursor:pointer;backdrop-filter:blur(6px);
  }
  .skip:hover{color:var(--accent);border-color:var(--gold);}

  .stack{perspective:1600px;}
  .sec{
    position:relative;background:var(--card);
    border:1px solid var(--gold-line);border-radius:12px;
    padding:32px 32px 30px;margin-bottom:24px;
    box-shadow:var(--shadow);
    opacity:0;transform:translateY(34px) rotateX(-9deg);
    transform-origin:50% 100%;
    transition:opacity .85s cubic-bezier(.2,.8,.25,1), transform .85s cubic-bezier(.2,.8,.25,1);
  }
  .sec.show{opacity:1;transform:none;}
  .sec::before{
    content:"";position:absolute;left:0;top:22px;bottom:22px;width:2px;
    background:linear-gradient(180deg,var(--gold-soft),rgba(227,213,190,0));
    border-radius:2px;opacity:.9;
  }
  .num{
    font-size:12px;letter-spacing:.22em;color:var(--gold);margin-bottom:10px;
  }
  .sec h3{
    margin:0 0 18px;font-size:16.5px;font-weight:600;letter-spacing:.13em;color:#5A4C3C;
    display:flex;align-items:center;gap:12px;
  }
  .sec h3::after{content:"";flex:1;height:1px;background:var(--gold-line);}
  .emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;
    font-size:15px;line-height:1;filter:saturate(.92);}
  .line{
    margin:0 0 10px;font-size:17px;line-height:2.15;letter-spacing:.03em;color:var(--ink);
    min-height:1.7em;
  }
  .line:last-child{margin-bottom:0;}
  .line.sub{font-size:16px;color:#6E6154;padding-left:16px;border-left:1px solid var(--gold-soft);}
  .line.typing::after{
    content:"";display:inline-block;width:1.5px;height:1.05em;background:var(--accent);
    vertical-align:-3px;margin-left:3px;animation:blink .85s steps(1) infinite;
  }
  @keyframes blink{0%,50%{opacity:1}51%,100%{opacity:0}}

  /* ---------------- 结语卡 ---------------- */
  .tail{
    position:relative;margin:30px 4px 0;padding:34px 30px 30px;text-align:center;
    background:linear-gradient(170deg,#FFFDF8 0%, #F7EFE1 100%);
    border:1px solid var(--gold-line);border-radius:14px;box-shadow:var(--shadow);
    opacity:0;transform:translateY(34px) scale(.985);transform-origin:50% 100%;
    transition:opacity .85s cubic-bezier(.2,.8,.25,1), transform .85s cubic-bezier(.2,.8,.25,1);
  }
  .tail.show{opacity:1;transform:none;}
  .tail .mark{
    font-size:40px;line-height:1;color:var(--gold-soft);margin-bottom:6px;
  }
  .tail p{
    margin:0;font-size:17px;line-height:2.15;letter-spacing:.03em;color:var(--ink);
  }
  .tail .emoline{margin-top:16px;font-size:19px;letter-spacing:.28em;}

  /* ---------------- 卡片 ---------------- */
  .cardsec{
    margin-top:40px;background:var(--card);border:1px solid var(--gold-line);
    border-radius:12px;padding:34px 32px;box-shadow:var(--shadow);
  }
  .cardsec .ps{font-size:11.5px;letter-spacing:.36em;color:var(--gold);margin-bottom:18px;}
  .card-closed p{margin:0 0 14px;font-size:16.5px;line-height:2.15;color:var(--ink);letter-spacing:.03em;}
  .flip-btn{
    margin-top:12px;font-family:inherit;cursor:pointer;font-size:14.5px;
    background:transparent;color:var(--accent);border:1px solid var(--gold);
    border-radius:999px;padding:11px 30px;letter-spacing:.22em;text-indent:.22em;
    transition:all .3s ease;
  }
  .flip-btn:hover{background:var(--gold);color:#fff;}
  .card-closed.hide{display:none;}
  .card-open{display:none;transform-origin:50% 0;}
  .card-open.show{display:block;animation:unfold .95s cubic-bezier(.2,.8,.25,1);}
  @keyframes unfold{
    0%{opacity:0;transform:rotateX(-72deg) translateY(10px);}
    60%{opacity:1;}
    100%{opacity:1;transform:none;}
  }
  .photo-frame{
    background:#fff;padding:10px;border:1px solid var(--gold-line);border-radius:6px;
    box-shadow:0 16px 34px rgba(150,124,92,.18);transform:rotate(-.7deg);
  }
  .card-photo{width:100%;display:block;border-radius:3px;}
  .card-cap{
    margin-top:22px;font-size:16px;color:var(--accent);text-align:center;letter-spacing:.08em;
  }

  .psline{
    margin:22px 4px 0;padding:20px 26px;text-align:center;
    border:1px dashed var(--gold-line);border-radius:14px;
    background:rgba(255,253,249,.55);
    font-size:16.5px;line-height:2.05;letter-spacing:.03em;color:#6E6154;
    opacity:0;transform:translateY(26px);
    transition:opacity .8s cubic-bezier(.2,.8,.25,1), transform .8s cubic-bezier(.2,.8,.25,1);
  }
  .psline.show{opacity:1;transform:none;}
  .psline .emo{margin-left:6px;}

  .sign{
    text-align:right;margin-top:34px;font-size:15px;color:var(--ink-soft);letter-spacing:.12em;
  }
  .foot{text-align:center;margin-top:36px;font-size:11.5px;color:#BCAE9C;letter-spacing:.34em;}
  .foot .dot{display:inline-block;width:3px;height:3px;background:var(--gold-soft);
    border-radius:50%;vertical-align:2px;margin:0 10px;transform:rotate(45deg);}

  @media (max-width:520px){
    .wrap{padding:58px 16px 74px;}
    .head h2{font-size:24px;}
    .sec{padding:26px 22px 24px;border-radius:10px;}
    .cardsec{padding:28px 22px;}
    .line{font-size:16.5px;line-height:2.1;}
    #cover h1{font-size:22px;letter-spacing:.18em;}
    .plane-wrap{width:170px;height:102px;}
    .tail{padding:28px 20px 24px;}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important;}
  }
</style>
</head>
<body>

<div class="prog" id="prog"></div>

<div id="cover">
  <div class="floats">
    <span class="f" style="width:9px;height:9px;left:13%;top:20%;animation-duration:9s"></span>
    <span class="f" style="width:5px;height:5px;left:79%;top:15%;animation-duration:11s"></span>
    <span class="f" style="width:7px;height:7px;left:64%;top:76%;animation-duration:13s"></span>
    <span class="f" style="width:4px;height:4px;left:25%;top:69%;animation-duration:10s"></span>
    <span class="f" style="width:6px;height:6px;left:88%;top:52%;animation-duration:12s"></span>
  </div>
  <div class="plane-wrap">
    <svg viewBox="0 0 130 90" aria-hidden="true">
      <path class="trail" d="M4 80 C 26 78, 46 66, 68 52" fill="none" stroke="#DCCBB0" stroke-width="1.6" stroke-linecap="round"/>
      <g class="plane">
        <path d="M8 46 L120 8 L66 78 L54 46 Z" fill="#FFFDF9" stroke="#C0A075" stroke-width="1.6" stroke-linejoin="round"/>
        <path d="M54 46 L120 8" stroke="#C0A075" stroke-width="1.2"/>
        <path d="M8 46 L54 46 L66 78 Z" fill="#F2E8D8" stroke="#C0A075" stroke-width="1.2" stroke-linejoin="round"/>
      </g>
    </svg>
  </div>
  <button class="open-btn" id="openBtn">点 开</button>
</div>

<button class="skip" id="skipBtn">跳过动画</button>

<div class="wrap">
  <div class="head">
    <div class="kicker">A LETTER FOR YOU</div>
    <h2>这是一份道歉信</h2>
    <div class="rule"></div>
    <div class="sub">写给小孙同学</div>
  </div>

  <div class="stack" id="stack">

    <section class="sec">
      <div class="num"></div>
      <h3>对不起<span class="emo"> 🙏</span></h3>
      <p class="line" data-text="首先，想跟你说声对不起。"></p>
      <p class="line" data-text="因为周一晚上我向你吐露了一些负面情绪，这也是我写这封信的主要目的。"></p>
    </section>

    <section class="sec">
      <div class="num"></div>
      <h3>我能理解你为什么拒绝<span class="emo"> 🤝</span></h3>
      <p class="line" data-text="大体如你所说：一是怕麻烦我，二是觉得没必要。"></p>
      <p class="line" data-text="而且，你有拒绝的权利。"></p>
    </section>

    <section class="sec">
      <div class="num"></div>
      <h3>我想说明我情绪崩溃的原因<span class="emo"> 🌧️</span></h3>
      <p class="line" data-text="希望你能理解「事出有因」。"></p>
      <p class="line" data-text="大概有两点：一是恐惧和难过，二是生理期把这份情绪放大了。"></p>
    </section>

    <section class="sec">
      <div class="num"></div>
      <h3>恐惧，与难过<span class="emo"> 😔</span></h3>
      <p class="line sub" data-text="恐惧的是——我害怕自己又过度热心、圣母心泛滥。我不想这样，也正在调整。"></p>
      <p class="line sub" data-text="难过的是——我当时以为，你觉得我释放的好意是一种负担，害怕需要回报，并且想把我推开。"></p>
    </section>

    <section class="sec">
      <div class="num"></div>
      <h3>现在，情绪过去了<span class="emo"> 🌿</span></h3>
      <p class="line" data-text="所以我来跟你说声对不起，完成一个闭环。"></p>
    </section>

    <section class="sec">
      <div class="num"></div>
      <h3>and一个小小的请求<span class="emo"> ✨</span></h3>
      <p class="line" data-text="如果可以的话，希望你不要太害怕麻烦我。"></p>
      <p class="line" data-text="其实人和人走近，是需要互相麻烦的~"></p>
    </section>

  </div>

  <div class="tail" id="tail">
    <div class="mark">&ldquo;</div>
    <p>我尽力把语言精简精简再精简了，<br>希望不要嫌我麻烦，以上~</p>
    <div class="emoline"><span class="emo">✨</span></div>
  </div>

  <div class="cardsec">
    <div class="ps">P.S. · 随花的那张卡片</div>
    <div class="card-closed" id="cardClosed">
      <p>其实那天晚上，我随花想一起送上的是一些祝福，写在卡片上了。如果你想看的话，可以打开。</p>
      <p>不过现在看来，你我性格不同，看重的会有所不同，我需要改变方式呀。</p>
      <button class="flip-btn" id="cardBtn">打开卡片</button>
    </div>
    <div class="card-open" id="cardOpen">

<script>
(function(){
  const cover  = document.getElementById('cover');
  const openBtn= document.getElementById('openBtn');
  const skipBtn= document.getElementById('skipBtn');
  const secs   = Array.from(document.querySelectorAll('.sec, .tail, .psline'));
  const prog   = document.getElementById('prog');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let started  = false;

  /* ---- 打字机 ---- */
  function fill(sec){
    sec.querySelectorAll('.line').forEach(p => p.textContent = p.dataset.text);
    sec.classList.add('done');
  }
  function typeSection(sec){
    if (sec.dataset.typed) return;
    sec.dataset.typed = '1';
    const lines = Array.from(sec.querySelectorAll('.line'));
    let i = 0;
    (function nextLine(){
      if (i >= lines.length){ sec.classList.add('done'); return; }
      const el = lines[i], txt = el.dataset.text || '';
      let j = 0;
      el.classList.add('typing');
      (function step(){
        if (j >= txt.length){
          el.classList.remove('typing'); i++;
          setTimeout(nextLine, 250); return;
        }
        const ch = txt.charAt(j);
        el.textContent += ch; j++;
        let d = 34;
        if ('，、；：'.indexOf(ch) > -1) d = 180;
        else if ('。！？…'.indexOf(ch) > -1) d = 320;
        else if (ch === '—') d = 130;
        setTimeout(step, d);
      })();
    })();
  }

  /* ---- 滚动触发：纸页翻入 + 打字 ---- */
  const io = new IntersectionObserver(entries => {
    entries.forEach(e => {
      if (!e.isIntersecting) return;
      e.target.classList.add('show');
      if (reduce) fill(e.target);
      else setTimeout(() => typeSection(e.target), 420);
      io.unobserve(e.target);
    });
  }, { threshold: 0.25 });

  function begin(){
    if (started) return;
    started = true;
    secs.forEach(s => io.observe(s));
  }

  /* ---- 信封拆封 ---- */
  openBtn.addEventListener('click', () => {
    if (started) return;
    cover.classList.add('fly');
    const wait = reduce ? 0 : 700;
    if (!reduce) setTimeout(() => cover.classList.add('gone'), wait);
    setTimeout(() => {
      cover.style.display = 'none';
      window.scrollTo(0, 0);
      begin();
    }, wait + (reduce ? 0 : 500));
  });

  skipBtn.addEventListener('click', () => {
    cover.style.display = 'none';
    started = true;
    secs.forEach(s => { s.classList.add('show'); fill(s); s.dataset.typed = '1'; });
  });

  /* ---- 顶部细金线进度 ---- */
  window.addEventListener('scroll', () => {
    const h = document.documentElement.scrollHeight - window.innerHeight;
    const p = h > 0 ? Math.min(1, window.scrollY / h) : 0;
    prog.style.width = (p * 100) + '%';
  }, { passive:true });

  /* ---- 随花的卡片 ---- */
  document.getElementById('cardBtn').addEventListener('click', () => {
    document.getElementById('cardClosed').classList.add('hide');
    const open = document.getElementById('cardOpen');
    open.classList.add('show');
    setTimeout(() => open.scrollIntoView({behavior:'smooth', block:'center'}), 150);
  });
})();
</script>
</body>
</html>
